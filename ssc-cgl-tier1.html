tr.hl td{background:#eaf8ef}.card table{border:0;border-radius:0}.sec b{font-weight:500}

th{background:var(--soft)}tr.hl td{background:var(--tint)}

/* ---- Motion and new parts ---- */
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.bar i{transform-origin:left;transition:width 1s linear}
.ani .bar i{animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.ani .row,.ani .stack>.card,.ani .hc,.ani #side>.card{animation:rise .45s both}
.ani .row:nth-child(2),.ani .stack>.card:nth-child(2){animation-delay:.06s}.ani .row:nth-child(3),.ani .stack>.card:nth-child(3){animation-delay:.12s}.ani .row:nth-child(4),.ani .stack>.card:nth-child(4){animation-delay:.18s}.ani .row:nth-child(n+5),.ani .stack>.card:nth-child(n+5){animation-delay:.24s}
.row{transition:transform .2s,box-shadow .2s}.row:hover{transform:translateX(5px)}
.go:active,.btn:active{transform:scale(.96)}
.go{transition:background .2s,transform .15s}
.tabs button{transition:color .2s,background .2s}

.mbox{background:var(--card);border-radius:8px;padding:26px;width:min(420px,100%);animation:pop .22s both;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox h3{margin:0 0 6px;font-size:22px}.mbox p{margin:0 0 14px;color:var(--mut)}.mbox .mt{color:var(--ink);font-weight:600}
.facts{display:flex;gap:10px;margin-bottom:12px}.facts div{flex:1;background:var(--soft);border-radius:6px;padding:12px;text-align:center;font-size:13px;color:var(--mut)}.facts b{display:block;font-size:24px;color:var(--ink)}

.ax{fill:var(--mut);font-size:11px}.vl{font-size:12px;font-weight:700;fill:var(--ink)}.gl0{stroke:var(--line)}

    var sets=Math.min(12,Math.max(qs.length>=5?1:0,Math.ceil(qs.length/SEC_SET)));

    var tp={};qs.forEach(function(q){tp[q.t]=(tp[q.t]||0)+1});
    Object.keys(tp).sort().forEach(function(tn){var name=nm(tn),sub=qs.filter(function(q){return q.t===tn});D.topics[G[0]].push(name);REG[name]={dyn:sub,pos:pos,neg:neg,n:TOP_N,kind:"top"};if(G[0]==="GK"){var gn=name+" Topic Test";REG[gn]={dyn:sub,pos:pos,neg:neg,n:TOP_N,kind:"top"};D.gktests.push([gn,Math.min(TOP_N,sub.length)])}});
  });
  var gkAll=bank.filter(function(q){return q.g==="GK"});
  if(gkAll.length){REG["Full GK Test (Mixed)"]={dyn:gkAll,pos:pos,neg:neg,n:25,kind:"top"};D.gktests.unshift(["Full GK Test (Mixed)",Math.min(25,gkAll.length)])}
  D.gkpdf=[];
  GK_PDFS.forEach(function(p,i){D.gkpdf.push([nm(p.name),p.pages||1,i>0?1:0]);REGPDF[nm(p.name)]={url:p.url}});
  Object.keys(NOTES).forEach(function(k,i){var name="GK Quick Notes: "+k;D.gkpdf.push([name,1,(GK_PDFS.length+i)>0?1:0]);REGPDF[name]={notes:k}});
  D.cutoff=CUTOFFS.map(function(r){return r.slice()});D.pyc=JSON.parse(JSON.stringify(PAST_CUTOFFS));D.acc={};
  applyState();
}
function applyState(){
  var st=getState();
  D.mocks.concat(D.pyp,D.sectional).forEach(function(o){var a=st.att[o.name];if(a){o.score=a.score;if(a.secs)o.secs=a.secs}});
  D.acc={};
  Object.keys(D.topics).forEach(function(g){D.topics[g].forEach(function(t){var v=st.tp[t];if(v&&v[1]>0)D.acc[t]=Math.round(v[0]/v[1]*100)})});
}

function overlay(){var o=document.getElementById("epx");if(!o){o=document.createElement("div");o.id="epx";o.className="epx";document.body.appendChild(o)}return o}
function closeTest(){clearInterval(etm);E=null;var o=document.getElementById("epx");if(o)o.remove();document.body.style.overflow="";recalc();go()}
function startTest(name,qs,o){
  if(!qs.length){toast("No questions in this test yet.");return}
  E={name:name,qs:qs,pos:o.pos,neg:o.neg,kind:o.kind,ans:qs.map(function(){return null}),mk:qs.map(function(){return false}),i:0,left:o.secs};
  document.body.style.overflow="hidden";clearInterval(etm);
  etm=setInterval(function(){E.left--;var e=document.getElementById("eptm");if(e)e.textContent=fmt(E.left);if(E.left<=0)submitTest()},1000);
  drawQ();
}
function drawQ(){
  var q=E.qs[E.i],gs=[],x="";E.qs.forEach(function(z){if(gs.indexOf(z.s)<0)gs.push(z.s)});
  x+='<div class="tp"><b>'+esc(E.name)+'</b><span class="tm" id="eptm">'+fmt(E.left)+'</span></div><div class="in">';
  if(gs.length>1)x+='<div class="sgs">'+gs.map(function(s){return'<button class="btn out sm" style="'+(q.s===s?"border-color:var(--ac)":"")+'" onclick="__ep.jump('+E.qs.findIndex(function(z){return z.s===s})+')">'+esc(s)+'</button>'}).join("")+'</div>';
  x+='<div class="qc"><div class="qm">Question '+(E.i+1)+' of '+E.qs.length+' · '+esc(q.s)+' · '+esc(q.t)+'</div><div class="qt">'+esc(q.q)+'</div>'+q.o.map(function(o,j){return'<button class="op '+(E.ans[E.i]===j?"sel":"")+'" onclick="__ep.pick('+j+')">'+"ABCDEF"[j]+". "+esc(o)+'</button>'}).join("")+'<div class="rw"><button class="btn out sm" onclick="__ep.jump(__ep.i()-1)">← Previous</button><button class="btn out sm" onclick="__ep.mark()">'+(E.mk[E.i]?"Unmark":"Mark for review")+'</button><button class="btn out sm" onclick="__ep.clear()">Clear</button><button class="btn sm" onclick="__ep.jump(__ep.i()+1)">Next →</button></div></div>';
  x+='<div class="qc"><div class="pl">'+E.qs.map(function(z,i){return'<button class="'+(E.mk[i]?"mk":E.ans[i]!==null?"an":"")+" "+(i===E.i?"cu":"")+'" onclick="__ep.jump('+i+')">'+(i+1)+'</button>'}).join("")+'</div><p class="qm">Green answered · Yellow marked for review</p><div class="rw"><button class="btn out sm" onclick="if(confirm(\'Leave this test? Your answers will be lost.\'))__ep.close()">Exit</button><button class="btn sm" onclick="if(confirm(\'Submit the test?\'))__ep.submit()">Submit test</button></div></div></div>';
  overlay().innerHTML=x;
}
function submitTest(){
  clearInterval(etm);if(!E)return;
  var st=getState(),sec={},gsum={},tot=0,cor=0,wr=0,n=E.qs.length;
  E.qs.forEach(function(q,i){var a=E.ans[i],ok=a===q.a,sc=a===null?0:ok?E.pos:-E.neg;tot+=sc;if(ok)cor++;else if(a!==null)wr++;
    var d=sec[q.s]=sec[q.s]||{sc:0,c:0,n:0};d.sc+=sc;d.n++;if(ok)d.c++;
    var g=grp(q);if(g){var z=gsum[g]=gsum[g]||{sc:0,mx:0};z.sc+=sc;z.mx+=E.pos}
    var tp=st.tp[q.t]=st.tp[q.t]||[0,0];tp[1]++;if(ok)tp[0]++});
  var max=+(n*E.pos).toFixed(2),score=+tot.toFixed(2),eq=Math.max(0,Math.round(score/max*200));
  var rec;
  if(E.kind==="mock"){rec={score:eq,secs:SECN.map(function(g){var z=gsum[g];return z&&z.mx?Math.max(0,Math.round(z.sc/z.mx*50)):0})}}
  else if(E.kind==="pyp"||E.kind==="sec"){rec={score:Math.max(0,Math.round(score))}}
  if(rec)st.att[E.name]=rec;
  putState(st);applyState();
  var x='<div class="tp"><b>Result: '+esc(E.name)+'</b><button class="btn sm" onclick="__ep.close()">Back to dashboard</button></div><div class="in"><div class="qc" style="text-align:center"><div class="big">'+score+' <span class="qm" style="font-size:16px">/ '+max+'</span></div><p><span class="ok">✔ '+cor+' correct</span> · <span class="no">✘ '+wr+' wrong</span> · '+(n-cor-wr)+' skipped · Accuracy '+Math.round(cor/n*100)+'%</p>';
  if(E.kind==="mock"){var cv=(D.cutoff.find(function(r){return r[0]==S.cat})||D.cutoff[0]),d=eq-cv[1];x+='<p>Scaled to 200 marks: <b>'+eq+'</b> · '+esc(cv[0])+' cutoff (2024): <b>'+cv[1]+'</b> · <b class="'+(d>=0?"ok":"no")+'">'+(d>=0?"+":"")+d+' marks</b></p>'}
  x+='</div><div class="qc"><b>Section-wise score</b><table><tr><th>Section</th><th>Score</th><th>Correct</th></tr>'+Object.keys(sec).map(function(s){return'<tr><td>'+esc(s)+'</td><td>'+(+sec[s].sc.toFixed(2))+' / '+(sec[s].n*E.pos)+'</td><td>'+sec[s].c+'/'+sec[s].n+'</td></tr>'}).join("")+'</table></div>';
  x+='<h3>Answers and explanations</h3>'+E.qs.map(function(q,i){var a=E.ans[i];return'<div class="qc"><div class="qm">Q'+(i+1)+' · '+esc(q.s)+' · '+esc(q.t)+'</div><div class="qt">'+esc(q.q)+'</div><div>Your answer: <b class="'+(a===q.a?"ok":"no")+'">'+(a===null?"Skipped":"ABCDEF"[a]+". "+esc(q.o[a]))+'</b><br>Correct: <b class="ok">'+"ABCDEF"[q.a]+". "+esc(q.o[q.a])+'</b></div>'+(q.e?'<div class="ex"><b>Explanation:</b> '+esc(q.e)+'</div>':"")+'</div>'}).join("")+'<div class="rw"><button class="btn sm" onclick="__ep.close()">Back to dashboard</button></div></div>';
  E.done=true;overlay().innerHTML=x;overlay().scrollTop=0;
}
