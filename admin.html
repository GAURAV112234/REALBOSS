<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrepPilot Admin</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--mute:#66707d;--line:#dde1e7;--accent:#1f5fbf;--bad:#b3261e;--ok:#1a7f45}
  @media (prefers-color-scheme:dark){:root{--bg:#14181e;--card:#1c222b;--ink:#e8ecf1;--mute:#98a2b0;--line:#2d3642;--accent:#6ea2ee;--bad:#f2928b;--ok:#6fd49a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:1.5rem;margin:0 0 4px}
  h2{font-size:1.1rem;margin:0 0 12px}
  p.sub{color:var(--mute);margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
  label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  textarea{min-height:80px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.row{grid-template-columns:1fr}}
  button{padding:10px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:16px}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);margin-top:0}
  button.del{background:transparent;color:var(--bad);border:1px solid var(--line);margin:0;padding:4px 10px;font-size:.85rem}
  button:disabled{opacity:.6;cursor:wait}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #msg{margin-top:12px;font-weight:600}
  .err{color:var(--bad)}.ok{color:var(--ok)}
  .q{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .q small{color:var(--mute);display:block}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>PrepPilot admin</h1><p class="sub">Add and manage mock test questions.</p></div>
    <button class="ghost" id="logoutBtn" hidden>Log out</button>
  </div>

  <!-- Login -->
  <section class="card" id="loginBox">
    <h2>Log in</h2>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" value="examplanner.pack@gmail.com">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn">Log in</button>
    <div id="loginMsg" class="err"></div>
  </section>

  <!-- Add question -->
  <section id="appBox" hidden>
    <div class="card">
      <h2>Add a question</h2>
      <div class="row">
        <div><label for="exam">Exam</label><input id="exam" placeholder="e.g. RRB ALP" list="examList"><datalist id="examList"></datalist></div>
        <div><label for="section">Section</label><input id="section" placeholder="e.g. Mathematics" list="secList"><datalist id="secList"></datalist></div>
      </div>
      <label for="question">Question</label>
      <textarea id="question" placeholder="Type the question here"></textarea>
      <div class="row">
        <div><label for="o0">Option A</label><input id="o0"></div>
        <div><label for="o1">Option B</label><input id="o1"></div>
        <div><label for="o2">Option C</label><input id="o2"></div>
        <div><label for="o3">Option D</label><input id="o3"></div>
      </div>
      <label for="answer">Correct answer</label>
      <select id="answer"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
      <label for="explanation">Explanation</label>
      <textarea id="explanation" placeholder="Why this answer is correct"></textarea>
      <button id="saveBtn">Save question</button>
      <div id="msg"></div>
    </div>

    <div class="card">
      <h2>Recent questions</h2>
      <div id="list"><p class="sub">Loading…</p></div>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, limit, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJrdu7luclBLm3wGcz8C3jZfGNlc4RSRc",
  authDomain: "admin-panel-d9ffa.firebaseapp.com",
  projectId: "admin-panel-d9ffa",
  storageBucket: "admin-panel-d9ffa.firebasestorage.app",
  messagingSenderId: "830924198451",
  appId: "1:830924198451:web:d16560fbd81b0fe0c38946"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

$("loginBtn").onclick = async () => {
  $("loginMsg").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
  } catch (e) {
    $("loginMsg").textContent = "Login failed: " + (e.code || e.message);
  }
};
$("password").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  const on = !!user;
  $("loginBox").hidden = on;
  $("appBox").hidden = !on;
  $("logoutBtn").hidden = !on;
  if (on) loadList();
});

function say(text, ok) {
  const m = $("msg");
  m.textContent = text;
  m.className = ok ? "ok" : "err";
}

$("saveBtn").onclick = async () => {
  const data = {
    exam: $("exam").value.trim(),
    section: $("section").value.trim(),
    question: $("question").value.trim(),
    options: [0, 1, 2, 3].map(i => $("o" + i).value.trim()),
    answer: Number($("answer").value),
    explanation: $("explanation").value.trim(),
    createdAt: serverTimestamp()
  };
  if (!data.exam || !data.section || !data.question || data.options.some(o => !o)) {
    return say("Fill in the exam, section, question and all four options.", false);
  }
  $("saveBtn").disabled = true;
  try {
    await addDoc(collection(db, "questions"), data);
    say("Question saved.", true);
    ["question", "o0", "o1", "o2", "o3", "explanation"].forEach(id => $(id).value = "");
    $("answer").value = "0";
    loadList();
  } catch (e) {
    say("Could not save: " + (e.code || e.message), false);
  }
  $("saveBtn").disabled = false;
};

async function loadList() {
  const box = $("list");
  try {
    const snap = await getDocs(query(collection(db, "questions"), orderBy("createdAt", "desc"), limit(30)));
    if (snap.empty) { box.innerHTML = '<p class="sub">No questions yet. Add your first one above.</p>'; return; }
    const exams = new Set(), secs = new Set();
    box.innerHTML = "";
    snap.forEach(d => {
      const q = d.data();
      exams.add(q.exam); secs.add(q.section);
      const row = document.createElement("div");
      row.className = "q";
      const left = document.createElement("div");
      const t = document.createElement("div"); t.textContent = q.question;
      const s = document.createElement("small");
      s.textContent = q.exam + " · " + q.section + " · Answer: " + "ABCD"[q.answer];
      left.append(t, s);
      const b = document.createElement("button");
      b.className = "del"; b.textContent = "Delete";
      b.onclick = async () => {
        if (!confirm("Delete this question?")) return;
        await deleteDoc(doc(db, "questions", d.id));
        loadList();
      };
      row.append(left, b);
      box.append(row);
    });
    $("examList").innerHTML = [...exams].map(v => `<option value="${v.replace(/"/g, "&quot;")}">`).join("");
    $("secList").innerHTML = [...secs].map(v => `<option value="${v.replace(/"/g, "&quot;")}">`).join("");
  } catch (e) {
    box.innerHTML = '<p class="err">Could not load questions: ' + (e.code || e.message) + "</p>";
  }
}
</script>
</body>
</html>
