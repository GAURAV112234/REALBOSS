<script>
const SEC={R:"Reasoning",Q:"Quant",E:"English",G:"General Awareness"},ORD=["R","Q","E","G"],SPQ=36,PER=25;
const TRI=`<svg viewBox="0 0 170 130" width="200"><polygon points="20,110 150,110 90,20" fill="none" stroke="currentColor" stroke-width="2"/><text x="32" y="104" fill="currentColor" font-size="12">50°</text><text x="118" y="104" fill="currentColor" font-size="12">60°</text><text x="82" y="46" fill="currentColor" font-size="12">?</text></svg>`;
const DIR=`<svg viewBox="0 0 170 160" width="200"><path d="M40 140V40H100V140" fill="none" stroke="currentColor" stroke-width="2"/><path d="M40 140H100" stroke="#d23b3b" stroke-width="2" stroke-dasharray="5"/><text x="8" y="95" fill="currentColor" font-size="12">5 km</text><text x="58" y="32" fill="currentColor" font-size="12">3 km</text><text x="106" y="95" fill="currentColor" font-size="12">5 km</text><text x="52" y="156" fill="#d23b3b" font-size="12">answer = 3 km</text><text x="30" y="154" fill="currentColor" font-size="11">S</text></svg>`;
let B=[];
B=[
{s:"R",t:"Number Series",q:"Find the next number: 2, 6, 12, 20, 30, ?",o:["40","42","44","36"],a:1,e:"Differences are 4, 6, 8, 10, so the next difference is 12. 30 + 12 = 42. (Also n×(n+1): 1×2, 2×3 … 6×7 = 42.)"},
{s:"R",t:"Coding-Decoding",q:"If CAT is coded as 24 (C=3, A=1, T=20, sum of positions), what is DOG?",o:["24","26","28","30"],a:1,e:"D=4, O=15, G=7. Sum = 4 + 15 + 7 = 26."},
{s:"R",t:"Blood Relations",q:"Pointing to a man, a woman says, “His mother is the only daughter of my mother.” How is the woman related to the man?",o:["Sister","Aunt","Mother","Grandmother"],a:2,e:"“Only daughter of my mother” is the woman herself. So the man’s mother = the woman. She is his mother."},
{s:"R",t:"Direction Sense",q:"Ram walks 5 km north, turns right and walks 3 km, then turns right and walks 5 km. How far is he from the start?",o:["3 km","5 km","8 km","13 km"],a:0,e:"North 5 and south 5 cancel out. Only the 3 km east remains. Distance = 3 km.",d:DIR},
{s:"R",t:"Classification",q:"Find the odd one out: 8, 27, 64, 100, 125",o:["27","64","100","125"],a:2,e:"8, 27, 64, 125 are cubes of 2, 3, 4, 5. 100 is not a cube."},
{s:"R",t:"Ranking",q:"Rahul is 7th from the top and 15th from the bottom in a class. How many students are there?",o:["21","22","23","20"],a:0,e:"Total = top rank + bottom rank − 1 = 7 + 15 − 1 = 21."},
{s:"R",t:"Analogy",q:"3 : 27 :: 4 : ?",o:["16","48","64","81"],a:2,e:"27 = 3³, so 4 → 4³ = 64."},
{s:"Q",t:"Percentage",q:"What is 20% of 40% of 500?",o:["20","40","50","80"],a:1,e:"40% of 500 = 200. 20% of 200 = 40."},
{s:"Q",t:"Profit & Loss",q:"An article bought for ₹400 is sold for ₹500. Profit percent?",o:["20%","25%","30%","10%"],a:1,e:"Profit = 100. Profit% = 100/400 × 100 = 25%."},
{s:"Q",t:"Time & Work",q:"A can finish a job in 10 days and B in 15 days. Working together, how many days?",o:["5","6","8","12"],a:1,e:"Use LCM 30 units: A = 3/day, B = 2/day, together 5/day. 30 ÷ 5 = 6 days."},
{s:"Q",t:"Average",q:"The average of 5 numbers is 20. When a sixth number is added the average becomes 22. Find the sixth number.",o:["30","32","34","42"],a:1,e:"New total = 6 × 22 = 132. Old total = 5 × 20 = 100. Sixth = 132 − 100 = 32."},
{s:"Q",t:"Simple Interest",q:"Simple interest on ₹1000 at 10% per year for 2 years?",o:["₹100","₹200","₹210","₹220"],a:1,e:"SI = P×R×T/100 = 1000×10×2/100 = ₹200."},
{s:"Q",t:"Geometry",q:"Two angles of a triangle are 50° and 60°. Find the third angle.",o:["60°","70°","80°","90°"],a:1,e:"Angles of a triangle add to 180°. 180 − 50 − 60 = 70°.",d:TRI},
{s:"Q",t:"Speed & Distance",q:"Convert 72 km/h into m/s.",o:["15","18","20","25"],a:2,e:"km/h → m/s: multiply by 5/18. 72 × 5/18 = 20 m/s."},
{s:"Q",t:"Ratio",q:"Divide ₹120 in the ratio 2 : 3. The larger share is?",o:["₹48","₹60","₹72","₹80"],a:2,e:"Total parts = 5, one part = 24. Larger share = 3 × 24 = ₹72."},
{s:"E",t:"Synonyms",q:"Choose the synonym of ABUNDANT.",o:["Scarce","Plentiful","Tiny","Weak"],a:1,e:"Abundant means existing in large quantity, the same as plentiful."},
{s:"E",t:"Antonyms",q:"Choose the antonym of ANCIENT.",o:["Old","Modern","Historic","Classic"],a:1,e:"Ancient means very old. The opposite is modern."},
{s:"E",t:"Grammar",q:"She ___ to school every day.",o:["go","goes","going","gone"],a:1,e:"Simple present with a singular subject (she) takes verb + s: goes."},
{s:"E",t:"One Word Substitution",q:"A person who loves books is called a ___",o:["Bibliophile","Philatelist","Linguist","Misanthrope"],a:0,e:"Biblio = book, phile = lover. Bibliophile."},
{s:"E",t:"Idioms",q:"What does “break the ice” mean?",o:["Break something cold","Start a conversation in an awkward situation","End a friendship","Get angry"],a:1,e:"To break the ice is to ease tension and start talking in a new or awkward situation."},
{s:"E",t:"Spelling",q:"Choose the correctly spelt word.",o:["Acommodation","Accomodation","Accommodation","Acomodation"],a:2,e:"Accommodation has double c and double m. Memory trick: it is big enough to accommodate two c’s and two m’s."},
{s:"E",t:"Voice",q:"Change to passive: “The cat ate the fish.”",o:["The fish is eaten by the cat.","The fish was eaten by the cat.","The fish has eaten the cat.","The cat was eaten by the fish."],a:1,e:"Past tense active becomes “was/were + past participle”. Object (fish) moves to the front."},
{s:"G",t:"Polity",q:"Which Article of the Constitution guarantees the Right to Life and Personal Liberty?",o:["Article 14","Article 19","Article 21","Article 32"],a:2,e:"Article 21 protects life and personal liberty. Article 14 is equality, 19 freedoms, 32 constitutional remedies."},
{s:"G",t:"Polity",q:"Fundamental Duties were added to the Constitution by which Amendment?",o:["42nd","44th","52nd","73rd"],a:0,e:"The 42nd Amendment (1976) added Fundamental Duties (Part IV-A, Article 51A)."},
{s:"G",t:"History",q:"The Battle of Plassey was fought in which year?",o:["1757","1764","1857","1699"],a:0,e:"Plassey (1757): Robert Clive defeated Siraj-ud-Daulah. Buxar was 1764."},
{s:"G",t:"History",q:"Who founded the Mauryan Empire?",o:["Ashoka","Bindusara","Chandragupta Maurya","Harshavardhana"],a:2,e:"Chandragupta Maurya founded it around 322 BCE with help from Chanakya."},
{s:"G",t:"Geography",q:"Which is the longest river flowing mostly within India?",o:["Yamuna","Ganga","Godavari","Narmada"],a:1,e:"The Ganga (about 2,525 km) is the longest river mostly within India. Godavari is the longest peninsular river."},
{s:"G",t:"Science",q:"The chemical symbol of Sodium is?",o:["So","Sd","Na","S"],a:2,e:"Na comes from the Latin “Natrium”. K (Kalium) is potassium."},
{s:"G",t:"Science",q:"Deficiency of which vitamin causes scurvy?",o:["Vitamin A","Vitamin B","Vitamin C","Vitamin D"],a:2,e:"Vitamin C (ascorbic acid) deficiency causes scurvy. Vitamin D gives rickets."},
{s:"G",t:"Economy",q:"The Reserve Bank of India was established in which year?",o:["1925","1935","1947","1949"],a:1,e:"RBI was set up on 1 April 1935 and nationalised in 1949."}];
const N={"Polity":["Constitution adopted 26 Nov 1949, effective 26 Jan 1950.","Fundamental Rights: Articles 12–35. Duties: Article 51A (42nd Amendment).","Art. 14 equality, 19 freedoms, 21 life and liberty, 32 remedies.","President is elected indirectly; PM heads the Council of Ministers."],
"History":["Plassey 1757, Buxar 1764, Revolt of 1857.","Mauryas: Chandragupta (founder), Bindusara, Ashoka (Kalinga war 261 BCE).","Gandhi: Champaran 1917, Non-Cooperation 1920, Dandi March 1930, Quit India 1942."],
"Geography":["Ganga is the longest river within India; Godavari the longest in peninsular India.","Tropic of Cancer passes through 8 Indian states.","Highest peak in India: Kangchenjunga."],
"Economy":["RBI set up 1935, nationalised 1949. NITI Aayog replaced Planning Commission in 2015.","Repo rate: rate at which RBI lends to banks.","GDP = value of final goods and services in a year."],
"Science":["Na sodium, K potassium, Fe iron, Au gold, Ag silver.","Vitamin C: scurvy; D: rickets; A: night blindness; B1: beri-beri.","Speed of light about 3×10⁸ m/s; unit of force: Newton."],
"Maths shortcuts":["km/h to m/s: ×5/18.","Time & Work: take LCM as total units.","Total of rank = top + bottom − 1.","SI = PRT/100; Profit% = Profit/CP × 100."]};
const $=i=>document.getElementById(i);let S=null,tm=null;
function ld(){try{return JSON.parse(localStorage.getItem("sscH"))||{}}catch(e){return{}}}
function sv(h){try{localStorage.setItem("sscH",JSON.stringify(h))}catch(e){}}
function shuf(a,seed){a=a.slice();const r=()=>(seed=(seed*16807)%2147483647)/2147483647;for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const topics=()=>[...new Set(B.map(q=>q.t))];
function home(){clearInterval(tm);S=null;const h=ld(),tp=Object.keys(h);
let x=`<div class="hero"><span class="pill">SSC CGL · TIER 1</span><h1>Practise like the real exam. Improve with every test.</h1><p class="lead">Full-length SSC CGL Tier 1 mocks with sectional and topic tests, clear explanations and a quick analysis of what to fix next.</p><div class="stats"><span>5 full mocks</span><span>Sectional and topic tests</span><span>Explanation for every answer</span></div></div><p class="mu">+2 for correct, −0.5 for wrong. Time is 36 seconds per question, as in the real exam (60 min for 100 Q).</p><h2>What you get</h2><div class="card"><ul class="ck"><li>Full-length mocks in the real CGL Tier 1 pattern: 100 questions, 60 minutes, +2 and −0.5 marking</li><li>Sectional and topic-wise tests, so you can fix one weak area at a time</li><li>Weaker and stronger topic analysis after every test</li><li>A step-by-step explanation for every answer, with diagrams where they help</li><li>GK notes that you can save as a PDF</li><li>Your progress is saved on this device</li></ul></div><h2>How it works</h2><div class="g steps"><div class="card"><b>1. Take a test</b><p class="mu">Start with a full mock, or pick a section or topic. The timer runs like the real exam.</p></div><div class="card"><b>2. See your analysis</b><p class="mu">Get your score by section, accuracy, and the topics that need work.</p></div><div class="card"><b>3. Learn and repeat</b><p class="mu">Read each explanation, practise the weak topic, then retake a mock.</p></div></div><div class="card np"><b>Load your question bank</b><p class="mu">Choose bank.json (or bank_for_app.js) from the pipeline. ${B.length} questions are loaded now.</p><input type="file" accept=".json,.js" onchange="loadBank(this.files[0])"></div><h2>Full mock tests</h2><div class="g">`;

function bar(t,p){const c=p<.5?"var(--no)":p<.75?"#e0a100":"var(--ok)";return `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${t} ${p<.5?"· weak":p>=.75?"· strong":""}</span><b>${Math.round(p*100)}%</b></div><div class="bar"><i style="width:${p*100}%;background:${c}"></i></div></div>`}
function start(type,k){let qs,title;
if(type=="mock"){qs=ORD.flatMap((s,i)=>{const p=shuf(B.filter(q=>q.s==s),42+i);return p.length>=PER*5?p.slice((k-1)*PER,k*PER):shuf(p,k*7+i).slice(0,PER)});title="Mock "+k}
else if(type=="sec"){qs=B.filter(q=>q.s==k);title=SEC[k]+" test"}
else{qs=B.filter(q=>q.t==k);title=k+" (topic test)"}
S={qs,title,ans:qs.map(()=>null),mk:qs.map(()=>false),i:0,left:qs.length*SPQ};
clearInterval(tm);tm=setInterval(()=>{S.left--;const e=$("tm");if(e)e.textContent=fmt(S.left);if(S.left<=0)submit()},1000);show()}
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function show(){const q=S.qs[S.i],secs=[...new Set(S.qs.map(q=>q.s))];
let x=`<div class="top"><b>${S.title}</b><span>⏱ <span id="tm">${fmt(S.left)}</span></span></div><div class="row" style="margin:0 0 8px">`+secs.map(s=>`<button class="b ${q.s==s?"sel":""}" onclick="go(${S.qs.findIndex(z=>z.s==s)})">${SEC[s]}</button>`).join("")+`</div>`;
x+=`<div class="card"><div class="mu">Q${S.i+1} of ${S.qs.length} · ${SEC[q.s]} · ${q.t}</div><p><b>${q.q}</b></p>`+q.o.map((o,j)=>`<button class="b o ${S.ans[S.i]===j?"sel":""}" onclick="pick(${j})">${"ABCD"[j]}. ${o}</button>`).join("")+`<div class="row"><button class="b" onclick="go(S.i-1)">← Previous</button><button class="b" onclick="S.mk[S.i]=!S.mk[S.i];show()">${S.mk[S.i]?"Unmark":"Mark for review"}</button><button class="b" onclick="S.ans[S.i]=null;show()">Clear</button><button class="b p" onclick="go(S.i+1)">Next →</button></div></div>`;
x+=`<div class="card"><div class="pal">`+S.qs.map((z,i)=>`<button class="${S.mk[i]?"mk":S.ans[i]!==null?"an":""} ${i==S.i?"cu":""}" onclick="go(${i})">${i+1}</button>`).join("")+`</div><p class="mu">Green answered · Yellow marked</p><button class="b p" onclick="if(confirm('Submit the test?'))submit()">Submit test</button></div>`;
$("app").innerHTML=x}
function go(i){if(i>=0&&i<S.qs.length){S.i=i;show()}}
function pick(j){S.ans[S.i]=j;show()}
function submit(){clearInterval(tm);const h=ld(),sec={},top={};let tot=0,cor=0,wr=0;
S.qs.forEach((q,i)=>{const a=S.ans[i],ok=a===q.a,sc=a===null?0:ok?2:-.5;tot+=sc;if(ok)cor++;else if(a!==null)wr++;
const d=sec[q.s]=sec[q.s]||{sc:0,c:0,n:0};d.sc+=sc;d.n++;if(ok)d.c++;
const t=top[q.t]=top[q.t]||[0,0];t[1]++;if(ok)t[0]++;const g=h[q.t]=h[q.t]||[0,0];g[1]++;if(ok)g[0]++});
sv(h);const n=S.qs.length;
let x=`<h1>Result: ${S.title}</h1><div class="card sc"><div class="ring" style="--p:${Math.max(0,tot)/(n*2)*100}"><b>${tot}</b><span>of ${n*2}</span></div><div><h2 style="margin:0 0 6px">Your score</h2><p style="margin:0"><span class="ok">✔ ${cor} correct</span> · <span class="no">✘ ${wr} wrong</span> · ${n-cor-wr} skipped<br>Accuracy ${Math.round(cor/n*100)}%</p></div></div>`;
x+=`<h2>Section-wise score</h2><div class="card"><table><tr><th>Section</th><th>Score</th><th>Correct</th></tr>`+Object.keys(sec).map(s=>`<tr><td>${SEC[s]}</td><td>${sec[s].sc} / ${sec[s].n*2}</td><td>${sec[s].c}/${sec[s].n}</td></tr>`).join("")+`</table></div>`;
const L=Object.entries(top).map(([t,v])=>[t,v[0]/v[1]]).sort((a,b)=>a[1]-b[1]),weak=L.filter(z=>z[1]<.5).map(z=>z[0]);
x+=`<h2>Weak and strong topics</h2><div class="card">`+L.map(([t,p])=>bar(t,p)).join("")+`<p>${weak.length?"<b>Focus on:</b> "+weak.join(", ")+". Take a topic test for each, then read the explanations below.":"No weak topic in this test. Keep practising to stay sharp."}</p></div><h2>Answers and explanations</h2>`;
S.qs.forEach((q,i)=>{const a=S.ans[i];x+=`<div class="card"><div class="mu">Q${i+1} · ${SEC[q.s]} · ${q.t}</div><p><b>${q.q}</b></p><p>Your answer: <b class="${a===q.a?"ok":"no"}">${a===null?"Skipped":"ABCD"[a]+". "+q.o[a]}</b><br>Correct: <b class="ok">${"ABCD"[q.a]}. ${q.o[q.a]}</b></p>${q.d?q.d:""}<div class="ex"><b>Explanation:</b> ${q.e}</div></div>`});
x+=`<div class="row"><button class="b p" onclick="home()">Back to home</button></div>`;$("app").innerHTML=x;scrollTo(0,0)}
function notes(){let x=`<div class="row np"><button class="b" onclick="home()">← Back</button><button class="b p" onclick="window.print()">Print / Save as PDF</button></div><h1>SSC CGL Tier 1: GK and Quick Notes</h1>`;
for(const k in N)x+=`<div class="card"><h2 style="margin-top:0">${k}</h2><ul>`+N[k].map(l=>`<li>${l}</li>`).join("")+`</ul></div>`;$("app").innerHTML=x}
function loadBank(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{let t=String(r.result).replace(/^\s*(const|let|var)\s+B\s*=/,"").replace(/;\s*$/,"");const a=JSON.parse(t);if(!Array.isArray(a)||!a.length||!a.every(q=>q.s&&q.t&&q.q&&Array.isArray(q.o)&&q.o.length==4&&q.a>=0&&q.a<4))throw 0;B=a;try{localStorage.setItem("sscB",JSON.stringify(a))}catch(e){}const c=ORD.map(s=>SEC[s]+": "+B.filter(q=>q.s==s).length).join("\n");alert("Loaded "+B.length+" questions\n"+c+"\n\nFor 5 non-repeating mocks you need 125 per section.");home()}catch(e){alert("This file is not a valid question bank.")}};r.readAsText(f)}
try{const s=localStorage.getItem("sscB");if(s){const a=JSON.parse(s);if(Array.isArray(a)&&a.length)B=a}}catch(e){}
home();
</script></body></html>
